<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="author" content="Kwizicle" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#1a9a5a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kwizicle" />

    <!--
      Per-page SEO (title, description, canonical, Open Graph, Twitter, JSON-LD)
      is managed per route via <Head> (react-helmet-async) so each prerendered
      page gets its own tags. See src/pages/*Page.tsx. Do NOT re-add static
      title/canonical/og tags here — they would duplicate and override the
      per-page ones (every page would canonicalize to the homepage).
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
